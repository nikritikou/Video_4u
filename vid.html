<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Love Story</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

body {
  background: #dce9ef;
}

.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  background:
    linear-gradient(
      to bottom,
      #a9d7ee 0%,
      #c9e4ef 48%,
      #e7d8c2 48%,
      #e7d8c2 100%
    );
}

/* =========================
   ΚΤΙΡΙΑ
========================= */

.building {
  position: absolute;
  bottom: 30%;
  background: #d8c7b5;
  border: 3px solid #b59f8b;
  z-index: 1;
}

.building.left {
  left: 0;
  width: 30%;
  height: 58%;
}

.building.middle {
  left: 27%;
  width: 30%;
  height: 65%;
  background: #cbb9a8;
}

.building.right {
  right: 0;
  width: 34%;
  height: 60%;
  background: #d5c2ae;
}

.window {
  position: absolute;
  width: 42px;
  height: 55px;
  background: #8bb5c7;
  border: 4px solid #765f51;
  box-shadow: inset 0 0 0 3px #d8c7b5;
}

.w1 { left: 18%; top: 15%; }
.w2 { left: 55%; top: 15%; }
.w3 { left: 18%; top: 48%; }
.w4 { left: 55%; top: 48%; }

.middle .w1 { left: 15%; }
.middle .w2 { left: 62%; }
.middle .w3 { left: 15%; }
.middle .w4 { left: 62%; }

/* =========================
   ΠΡΑΣΙΝΗ ΠΟΡΤΑ
========================= */

.entrance {
  position: absolute;
  left: 17%;
  bottom: 30%;
  width: 125px;
  height: 220px;
  z-index: 8;
}

.door-frame {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 125px;
  height: 220px;
  background: #40382f;
  border-radius: 8px 8px 0 0;
  padding: 8px;
}

.green-door {
  position: relative;
  width: 100%;
  height: 100%;
  background: #2f704e;
  border: 5px solid #1d4e36;
  border-radius: 5px 5px 0 0;
  transform-origin: left center;
  transition: transform 1s ease;
}

.green-door::before {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  top: 15px;
  bottom: 15px;
  border: 2px solid rgba(255,255,255,.25);
}

.green-door::after {
  content: "";
  position: absolute;
  right: 14px;
  top: 50%;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e5c16c;
}

.green-door.open {
  transform: perspective(600px) rotateY(-72deg);
}

/* =========================
   ΔΡΟΜΟΣ / ΠΕΖΟΔΡΟΜΙΟ
========================= */

.sidewalk {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20%;
  height: 10%;
  background: #bdb6ac;
  border-top: 5px solid #9d968d;
  border-bottom: 5px solid #aaa39a;
  z-index: 4;
}

.road {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 20%;
  background: #45484b;
  z-index: 3;
}

.road::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 7px;
  background: repeating-linear-gradient(
    to right,
    #eee 0 70px,
    transparent 70px 135px
  );
}

/* =========================
   ΗΛΙΟΣ
========================= */

.sun {
  position: absolute;
  right: 8%;
  top: 8%;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #ffd86b;
  box-shadow: 0 0 35px rgba(255,216,107,.7);
  z-index: 0;
}

/* =========================
   ΑΥΤΟΚΙΝΗΤΟ MINI
========================= */

.car {
  position: absolute;
  left: 57%;
  bottom: 21%;
  width: 350px;
  height: 150px;
  transform: translateX(-50%);
  z-index: 25;
  transition:
    left 4s ease-in-out,
    transform 4s ease-in-out;
}

.car.drive {
  left: 125%;
}

.car-body {
  position: absolute;
  left: 0;
  bottom: 15px;
  width: 350px;
  height: 90px;
  background: #d6b98a;
  border: 4px solid #715f4b;
  border-radius: 48px 55px 22px 25px;
  z-index: 2;
}

.car-roof {
  position: absolute;
  left: 65px;
  top: 5px;
  width: 220px;
  height: 75px;
  background: #151515;
  border: 4px solid #302b27;
  border-radius: 100px 100px 15px 15px;
  z-index: 4;
}

.window-front,
.window-back {
  position: absolute;
  top: 14px;
  height: 53px;
  background: #9bc5d1;
  border: 3px solid #252525;
  z-index: 5;
}

.window-front {
  left: 180px;
  width: 85px;
  border-radius: 8px 35px 5px 5px;
}

.window-back {
  left: 88px;
  width: 85px;
  border-radius: 35px 8px 5px 5px;
}

.car-door-line {
  position: absolute;
  left: 183px;
  top: 77px;
  width: 3px;
  height: 65px;
  background: #8d7659;
  z-index: 6;
}

.handle {
  position: absolute;
  left: 222px;
  top: 88px;
  width: 30px;
  height: 7px;
  border-radius: 5px;
  background: #5d4d3c;
  z-index: 7;
}

.wheel {
  position: absolute;
  bottom: 0;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #202020;
  border: 6px solid #111;
  z-index: 8;
}

.wheel::after {
  content: "";
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  background: #aaa;
  border: 4px solid #555;
}

.wheel.left {
  left: 48px;
}

.wheel.right {
  right: 48px;
}

.headlight {
  position: absolute;
  right: 8px;
  top: 40px;
  width: 25px;
  height: 22px;
  border-radius: 50%;
  background: #fff4a8;
  border: 3px solid #9c896e;
  z-index: 9;
}

/* =========================
   ΑΝΘΡΩΠΟΙ
========================= */

.person {
  position: absolute;
  width: 82px;
  height: 205px;
  bottom: 30%;
  z-index: 40;
  transition:
    left 2s ease-in-out,
    opacity 1s ease,
    transform 1s ease;
}

/* ΚΕΦΑΛΙ */

.head {
  position: absolute;
  left: 18px;
  top: 4px;
  width: 48px;
  height: 53px;
  border-radius: 48% 48% 45% 45%;
  background: #f0bf94;
  border: 2px solid #b77f5d;
  z-index: 4;
}

.eye {
  position: absolute;
  top: 22px;
  width: 5px;
  height: 6px;
  border-radius: 50%;
  background: #222;
}

.eye.left {
  left: 13px;
}

.eye.right {
  right: 13px;
}

.nose {
  position: absolute;
  left: 22px;
  top: 29px;
  width: 6px;
  height: 7px;
  border-right: 2px solid #a96f50;
  transform: rotate(15deg);
}

.mouth {
  position: absolute;
  left: 17px;
  top: 40px;
  width: 14px;
  height: 6px;
  border-bottom: 2px solid #8e4e45;
  border-radius: 50%;
}

/* =========================
   ΑΝΤΡΑΣ
========================= */

.man {
  left: calc(57% - 190px);
}

.man .head {
  background: #efbd91;
}

/* σχεδόν φαλακρός */
.man .head::before {
  content: "";
  position: absolute;
  left: 3px;
  top: -3px;
  width: 38px;
  height: 18px;
  background: #e9b98d;
  border-radius: 50% 50% 35% 35%;
}

.man .beard {
  position: absolute;
  left: 9px;
  bottom: 2px;
  width: 30px;
  height: 14px;
  border-radius: 0 0 15px 15px;
  background: #4a3931;
  opacity: .65;
  z-index: 5;
}

/* μαύρο hoodie */
.man .body {
  position: absolute;
  left: 9px;
  top: 52px;
  width: 64px;
  height: 78px;
  background: #151515;
  border-radius: 14px 14px 7px 7px;
  z-index: 2;
}

/* λευκό μπλουζάκι που φαίνεται */
.man .shirt {
  position: absolute;
  left: 27px;
  top: 56px;
  width: 28px;
  height: 26px;
  background: white;
  clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
  z-index: 3;
}

/* κορδόνια hoodie */
.man .hoodie-string {
  position: absolute;
  top: 70px;
  width: 2px;
  height: 20px;
  background: white;
  z-index: 5;
}

.man .string1 {
  left: 29px;
}

.man .string2 {
  left: 50px;
}

/* χέρια */
.arm {
  position: absolute;
  top: 59px;
  width: 17px;
  height: 65px;
  background: #151515;
  border-radius: 10px;
  z-index: 1;
}

.man .arm.left {
  left: 1px;
  transform: rotate(7deg);
}

.man .arm.right {
  right: 1px;
  transform: rotate(-7deg);
}

/* μαύρο παντελόνι */
.man .leg {
  position: absolute;
  top: 123px;
  width: 25px;
  height: 58px;
  background: #111;
  z-index: 2;
}

.man .leg.left {
  left: 14px;
}

.man .leg.right {
  right: 14px;
}

/* λευκά παπούτσια */
.shoe {
  position: absolute;
  top: 176px;
  width: 35px;
  height: 18px;
  background: white;
  border: 2px solid #bbb;
  border-radius: 12px 12px 5px 5px;
  z-index: 4;
}

.man .shoe.left {
  left: 7px;
}

.man .shoe.right {
  right: 7px;
}

/* =========================
   ΚΟΠΕΛΑ
========================= */

.girl {
  left: calc(17% + 20px);
  opacity: 0;
}

.girl .head {
  background: #f3c59d;
}

/* ξανθά μαλλιά */
.girl-hair {
  position: absolute;
  left: 10px;
  top: -1px;
  width: 64px;
  height: 65px;
  background: #e8c85e;
  border-radius: 50% 50% 42% 42%;
  z-index: 3;
}

.girl-hair::after {
  content: "";
  position: absolute;
  left: 0;
  top: 28px;
  width: 14px;
  height: 38px;
  background: #e8c85e;
  border-radius: 0 0 12px 12px;
}

.girl .head {
  z-index: 4;
}

/* γκρι hoodie */
.girl .body {
  position: absolute;
  left: 9px;
  top: 52px;
  width: 64px;
  height: 78px;
  background: #8c8c8c;
  border-radius: 14px 14px 7px 7px;
  z-index: 2;
}

/* χέρια */
.girl .arm {
  position: absolute;
  top: 59px;
  width: 17px;
  height: 65px;
  background: #8c8c8c;
  border-radius: 10px;
  z-index: 1;
}

.girl .arm.left {
  left: 1px;
  transform: rotate(7deg);
}

.girl .arm.right {
  right: 1px;
  transform: rotate(-7deg);
}

/* μπλε τζιν */
.girl .leg {
  position: absolute;
  top: 123px;
  width: 25px;
  height: 58px;
  background: #32629b;
  z-index: 2;
}

.girl .leg.left {
  left: 14px;
}

.girl .leg.right {
  right: 14px;
}

/* λευκά παπούτσια */
.girl .shoe.left {
  left: 7px;
}

.girl .shoe.right {
  right: 7px;
}

/* =========================
   ΛΟΥΛΟΥΔΙΑ
========================= */

.flowers {
  position: absolute;
  left: calc(57% - 240px);
  bottom: 42%;
  width: 80px;
  height: 90px;
  z-index: 60;
  opacity: 0;
  transition:
    left 2s ease-in-out,
    opacity .6s ease;
}

.flowers.show {
  opacity: 1;
}

.flowers.to-girl {
  left: calc(17% + 120px);
}

.stem {
  position: absolute;
  left: 37px;
  bottom: 4px;
  width: 5px;
  height: 62px;
  background: #3f8146;
  transform: rotate(-8deg);
  transform-origin: bottom;
}

.leaf {
  position: absolute;
  width: 25px;
  height: 12px;
  background: #4e934f;
  border-radius: 100% 0 100% 0;
}

.leaf.one {
  left: 18px;
  bottom: 35px;
  transform: rotate(25deg);
}

.leaf.two {
  left: 38px;
  bottom: 25px;
  transform: rotate(-25deg);
}

.flower {
  position: absolute;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #ffd83d;
  border: 4px solid #e7b900;
}

.flower::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #6b4b2a;
}

.f1 {
  left: 15px;
  top: 0;
}

.f2 {
  left: 38px;
  top: 8px;
}

.f3 {
  left: 27px;
  top: 24px;
}

/* =========================
   ΦΙΛΙ
========================= */

.kiss-mark {
  position: absolute;
  left: calc(17% + 180px);
  bottom: calc(30% + 145px);
  font-size: 34px;
  z-index: 100;
  opacity: 0;
  transform: scale(.3);
  transition: opacity .4s, transform .4s;
}

.kiss-mark.show {
  opacity: 1;
  transform: scale(1);
}

/* =========================
   ΚΑΡΔΙΕΣ
========================= */

.hearts {
  position: absolute;
  left: 57%;
  bottom: 43%;
  z-index: 100;
  opacity: 0;
  transition: opacity .8s;
  font-size: 28px;
  letter-spacing: 8px;
}

.hearts.show {
  opacity: 1;
  animation: heartsFloat 1.5s ease-in-out infinite alternate;
}

@keyframes heartsFloat {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-18px);
  }
}

/* =========================
   ΚΙΝΗΣΕΙΣ
========================= */

/* άντρας βγαίνει από το αυτοκίνητο */
.man.exit-car {
  left: calc(57% - 225px);
}

/* κοπέλα βγαίνει από την πόρτα */
.girl.exit-building {
  opacity: 1;
  left: calc(17% + 95px);
}

/* πλησιάζουν */
.man.go-girl {
  left: calc(17% + 135px);
}

.girl.go-man {
  left: calc(17% + 205px);
}

/* θέση για φιλί */
.man.kiss-position {
  left: calc(17% + 175px);
}

.girl.kiss-position {
  left: calc(17% + 215px);
}

/* μπαίνουν στο αυτοκίνητο */
.man.enter-car {
  left: calc(57% - 150px);
  opacity: 0;
  transform: translateY(15px) scale(.85);
}

.girl.enter-car {
  left: calc(57% - 95px);
  opacity: 0;
  transform: translateY(15px) scale(.85);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  .car {
    transform: translateX(-50%) scale(.75);
    transform-origin: bottom center;
  }

  .person {
    transform: scale(.82);
    transform-origin: bottom center;
  }

  .entrance {
    transform: scale(.75);
    transform-origin: bottom left;
  }

  .flowers {
    transform: scale(.8);
    transform-origin: bottom left;
  }

  .building.left {
    width: 35%;
  }

  .building.middle {
    left: 30%;
    width: 35%;
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="sun"></div>

  <!-- ΚΤΙΡΙΑ -->
  <div class="building left">
    <div class="window w1"></div>
    <div class="window w2"></div>
    <div class="window w3"></div>
    <div class="window w4"></div>
  </div>

  <div class="building middle">
    <div class="window w1"></div>
    <div class="window w2"></div>
    <div class="window w3"></div>
    <div class="window w4"></div>
  </div>

  <div class="building right">
    <div class="window w1"></div>
    <div class="window w2"></div>
    <div class="window w3"></div>
    <div class="window w4"></div>
  </div>

  <!-- ΠΡΑΣΙΝΗ ΠΟΡΤΑ -->
  <div class="entrance">
    <div class="door-frame">
      <div class="green-door" id="greenDoor"></div>
    </div>
  </div>

  <!-- ΠΕΖΟΔΡΟΜΙΟ -->
  <div class="sidewalk"></div>

  <!-- ΔΡΟΜΟΣ -->
  <div class="road"></div>

  <!-- ΑΥΤΟΚΙΝΗΤΟ -->
  <div class="car" id="car">

    <div class="car-roof"></div>

    <div class="window-back"></div>
    <div class="window-front"></div>

    <div class="car-body"></div>

    <div class="car-door-line"></div>
    <div class="handle"></div>

    <div class="headlight"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>

  </div>

  <!-- ΑΝΤΡΑΣ -->
  <div class="person man" id="man">

    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="beard"></div>
    </div>

    <div class="body"></div>
    <div class="shirt"></div>

    <div class="hoodie-string string1"></div>
    <div class="hoodie-string string2"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

  </div>

  <!-- ΚΟΠΕΛΑ -->
  <div class="person girl" id="girl">

    <div class="girl-hair"></div>

    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>

    <div class="body"></div>

    <div class="arm left"></div>
    <div class="arm right"></div>

    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="shoe left"></div>
    <div class="shoe right"></div>

  </div>

  <!-- ΛΟΥΛΟΥΔΙΑ -->
  <div class="flowers" id="flowers">

    <div class="stem"></div>

    <div class="leaf one"></div>
    <div class="leaf two"></div>

    <div class="flower f1"></div>
    <div class="flower f2"></div>
    <div class="flower f3"></div>

  </div>

  <!-- ΦΙΛΙ -->
  <div class="kiss-mark" id="kissMark">💋</div>

  <!-- ΚΑΡΔΙΕΣ -->
  <div class="hearts" id="hearts">
    ❤️ 💕 ❤️
  </div>

</div>

<script>

const man = document.getElementById("man");
const girl = document.getElementById("girl");
const door = document.getElementById("greenDoor");
const flowers = document.getElementById("flowers");
const kissMark = document.getElementById("kissMark");
const hearts = document.getElementById("hearts");
const car = document.getElementById("car");

/*
  Η ΣΕΙΡΑ ΤΗΣ ΣΚΗΝΗΣ:

  1. Ο άντρας βγαίνει από το Mini.
  2. Ανοίγει η πράσινη πόρτα.
  3. Η κοπέλα βγαίνει από το κτίριο.
  4. Πλησιάζουν.
  5. Ο άντρας παίρνει/δίνει τα ηλιοτρόπια.
  6. Φιλιούνται.
  7. Εμφανίζονται καρδιές.
  8. Μπαίνουν στο Mini.
  9. Το Mini φεύγει.
*/

// 1. Ο άντρας βγαίνει από το αυτοκίνητο
setTimeout(() => {
  man.classList.add("exit-car");
}, 700);


// 2. Ανοίγει η πράσινη πόρτα
setTimeout(() => {
  door.classList.add("open");
}, 2600);


// 3. Η κοπέλα βγαίνει από την πόρτα
setTimeout(() => {
  girl.classList.add("exit-building");
}, 3300);


// 4. Η κοπέλα πλησιάζει
setTimeout(() => {
  girl.classList.add("go-man");
}, 4800);


// 5. Ο άντρας πλησιάζει
setTimeout(() => {
  man.classList.add("go-girl");
}, 5000);


// 6. Εμφανίζονται τα λουλούδια
setTimeout(() => {
  flowers.classList.add("show");
}, 6200);


// 7. Τα λουλούδια πηγαίνουν προς την κοπέλα
setTimeout(() => {
  flowers.classList.add("to-girl");
}, 7000);


// 8. Πηγαίνουν στη θέση για φιλί
setTimeout(() => {
  man.classList.add("kiss-position");
  girl.classList.add("kiss-position");
}, 8200);


// 9. Εμφανίζεται το φιλί
setTimeout(() => {
  kissMark.classList.add("show");
}, 9000);


// 10. Εμφανίζονται καρδιές
setTimeout(() => {
  hearts.classList.add("show");
}, 9700);


// 11. Κλείνει η σκηνή του φιλιού
setTimeout(() => {
  kissMark.classList.remove("show");
}, 10800);


// 12. Μπαίνουν στο αυτοκίνητο
setTimeout(() => {
  man.classList.add("enter-car");
  girl.classList.add("enter-car");
  hearts.classList.remove("show");
}, 11500);


// 13. Το αυτοκίνητο φεύγει
setTimeout(() => {
  car.classList.add("drive");
}, 13000);

</script>

</body>
</html>
