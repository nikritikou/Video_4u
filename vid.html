<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μια μικρή ιστορία αγάπης</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #c9d4dc;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #b9cbd6 0%,
            #dce1df 54%,
            #a5a29c 54%,
            #a5a29c 70%,
            #555655 70%,
            #414242 100%
        );
}

/* =====================================
   ΠΟΛΥΚΑΤΟΙΚΙΕΣ
===================================== */

.building {
    position: absolute;
    bottom: 46%;
    background: #a69d95;
    border: 3px solid #8b847e;
}

.building.left {
    left: 0;
    width: 31%;
    height: 58%;
}

.building.middle {
    left: 28%;
    width: 30%;
    height: 66%;
    background: #b2aaa3;
}

.building.right {
    right: 0;
    width: 34%;
    height: 61%;
    background: #98938f;
}

.window {
    position: absolute;
    width: 30px;
    height: 40px;
    background: #d7dfe0;
    border: 3px solid #6f6c68;
}

.window.lit {
    background: #f2d47e;
}

.b1w1 { left: 20px; top: 35px; }
.b1w2 { left: 90px; top: 35px; }
.b1w3 { left: 160px; top: 35px; }
.b1w4 { left: 20px; top: 105px; }
.b1w5 { left: 90px; top: 105px; }
.b1w6 { left: 160px; top: 105px; }
.b1w7 { left: 20px; top: 175px; }
.b1w8 { left: 90px; top: 175px; }
.b1w9 { left: 160px; top: 175px; }

.b2w1 { left: 30px; top: 40px; }
.b2w2 { left: 105px; top: 40px; }
.b2w3 { left: 180px; top: 40px; }
.b2w4 { left: 30px; top: 115px; }
.b2w5 { left: 105px; top: 115px; }
.b2w6 { left: 180px; top: 115px; }
.b2w7 { left: 30px; top: 190px; }
.b2w8 { left: 105px; top: 190px; }
.b2w9 { left: 180px; top: 190px; }

.b3w1 { left: 25px; top: 35px; }
.b3w2 { left: 100px; top: 35px; }
.b3w3 { left: 175px; top: 35px; }
.b3w4 { left: 25px; top: 110px; }
.b3w5 { left: 100px; top: 110px; }
.b3w6 { left: 175px; top: 110px; }
.b3w7 { left: 25px; top: 185px; }
.b3w8 { left: 100px; top: 185px; }
.b3w9 { left: 175px; top: 185px; }

/* =====================================
   ΠΡΑΣΙΝΗ ΠΟΡΤΑ
===================================== */

.entrance {
    position: absolute;
    left: 20%;
    bottom: 46%;
    width: 105px;
    height: 210px;
    background: #77706a;
    border: 6px solid #615d58;
    z-index: 5;
}

.green-door {
    position: absolute;
    left: 13px;
    bottom: 0;
    width: 79px;
    height: 194px;
    background: #2d6849;
    border: 4px solid #1d4935;
    border-radius: 4px 4px 0 0;
    transform-origin: left center;
    transition: transform .8s ease;
}

.green-door.open {
    transform: perspective(500px) rotateY(-65deg);
}

.door-window {
    position: absolute;
    top: 18px;
    left: 16px;
    width: 43px;
    height: 62px;
    background: #8eaaa0;
    border: 3px solid #193d2d;
}

.door-handle {
    position: absolute;
    right: 9px;
    top: 102px;
    width: 8px;
    height: 8px;
    background: #d8bd65;
    border-radius: 50%;
}

/* =====================================
   ΠΕΖΟΔΡΟΜΙΟ ΚΑΙ ΔΡΟΜΟΣ
===================================== */

.sidewalk {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 30%;
    height: 16%;
    background: #aaa7a1;
    border-top: 5px solid #817e79;
    border-bottom: 5px solid #8b8882;
}

.road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30%;
    background: #4c4e4e;
}

.road-line {
    position: absolute;
    top: 52%;
    left: 0;
    width: 100%;
    height: 5px;
    background: repeating-linear-gradient(
        to right,
        #e6e2d7 0 75px,
        transparent 75px 145px
    );
}

/* =====================================
   MINI COOPER
===================================== */

.car {
    position: absolute;
    left: 53%;
    bottom: 31%;
    width: 330px;
    height: 145px;
    z-index: 20;
    transform: translateX(-50%);
    transition: left 4s ease-in-out;
}

.car.drive {
    left: 125%;
}

.car-body {
    position: absolute;
    left: 0;
    bottom: 18px;
    width: 330px;
    height: 88px;
    background: #cdbc9a;
    border: 4px solid #514c45;
    border-radius: 55px 72px 25px 25px;
}

.car-roof {
    position: absolute;
    left: 68px;
    top: 7px;
    width: 195px;
    height: 76px;
    background: #202121;
    border: 4px solid #514c45;
    border-radius: 80px 80px 10px 10px;
    z-index: 4;
}

.car-window {
    position: absolute;
    top: 18px;
    height: 52px;
    background: #8ea2ab;
    border: 3px solid #353838;
    z-index: 5;
}

.car-window.back {
    left: 82px;
    width: 70px;
    border-radius: 38px 5px 5px 5px;
}

.car-window.front {
    left: 158px;
    width: 87px;
    border-radius: 5px 42px 5px 5px;
}

.window-divider {
    position: absolute;
    left: 153px;
    top: 14px;
    width: 5px;
    height: 62px;
    background: #252626;
    z-index: 7;
}

.wheel {
    position: absolute;
    bottom: 0;
    width: 60px;
    height: 60px;
    background: #222;
    border: 5px solid #353535;
    border-radius: 50%;
    z-index: 12;
}

.wheel::after {
    content: "";
    position: absolute;
    left: 14px;
    top: 14px;
    width: 22px;
    height: 22px;
    background: #aaa;
    border-radius: 50%;
}

.wheel.left {
    left: 43px;
}

.wheel.right {
    right: 43px;
}

.headlight {
    position: absolute;
    right: 2px;
    top: 47px;
    width: 25px;
    height: 20px;
    background: #fff0a8;
    border: 3px solid #635a4f;
    border-radius: 50%;
    z-index: 15;
}

.taillight {
    position: absolute;
    left: 2px;
    top: 47px;
    width: 23px;
    height: 19px;
    background: #c74d47;
    border: 3px solid #635a4f;
    border-radius: 50%;
    z-index: 15;
}

/* =====================================
   ΑΝΘΡΩΠΟΙ
===================================== */

.person {
    position: absolute;
    width: 82px;
    height: 205px;
    bottom: 46%;
    z-index: 40;
    transition:
        left 1.8s ease,
        transform 1.2s ease,
        opacity .8s ease;
}

/* ΙΔΙΟ ΥΨΟΣ */
.man {
    left: calc(53% - 175px);
}

.girl {
    left: calc(20% + 125px);
}

/* =====================================
   ΚΕΦΑΛΙ
===================================== */

.head {
    position: absolute;
    left: 19px;
    top: 0;
    width: 45px;
    height: 48px;
    background: #dca77e;
    border-radius: 45%;
    z-index: 5;
}

.man .head {
    background: #dba47b;
}

/* καραφλός */
.man .head::before {
    content: "";
    position: absolute;
    left: 2px;
    top: -2px;
    width: 41px;
    height: 16px;
    background: #e0aa82;
    border-radius: 50%;
}

.beard {
    position: absolute;
    left: 9px;
    bottom: 2px;
    width: 28px;
    height: 13px;
    background: #46362e;
    border-radius: 0 0 15px 15px;
    opacity: .8;
}

.eye {
    position: absolute;
    top: 20px;
    width: 4px;
    height: 4px;
    background: #222;
    border-radius: 50%;
}

.eye.left {
    left: 11px;
}

.eye.right {
    right: 11px;
}

.girl-hair {
    position: absolute;
    left: 11px;
    top: -7px;
    width: 60px;
    height: 68px;
    background: #e5c16d;
    border-radius: 50%;
    z-index: 4;
}

.girl-hair::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 26px;
    width: 18px;
    height: 53px;
    background: #e5c16d;
    border-radius: 0 50% 50% 0;
}

/* =====================================
   ΣΩΜΑ
===================================== */

.body {
    position: absolute;
    top: 45px;
    left: 9px;
    width: 64px;
    height: 73px;
    border-radius: 17px 17px 8px 8px;
}

.man .body {
    background: #171819;
}

.girl .body {
    background: #8b8d8d;
}

/* λευκή μπλούζα που φαίνεται */
.white-shirt {
    position: absolute;
    top: 46px;
    left: 24px;
    width: 34px;
    height: 15px;
    background: white;
    border-radius: 0 0 5px 5px;
    z-index: 8;
}

/* =====================================
   ΧΕΡΙΑ
===================================== */

.arm {
    position: absolute;
    top: 53px;
    width: 18px;
    height: 67px;
    border-radius: 12px;
}

.man .arm {
    background: #171819;
}

.girl .arm {
    background: #8b8d8d;
}

.arm.left {
    left: 0;
    transform: rotate(7deg);
}

.arm.right {
    right: 0;
    transform: rotate(-7deg);
}

/* =====================================
   ΠΑΝΤΕΛΟΝΙΑ
===================================== */

.pants {
    position: absolute;
    top: 116px;
    left: 13px;
    width: 56px;
    height: 62px;
}

.man .pants {
    background: #171819;
}

.girl .pants {
    background: #41688f;
}

.leg {
    position: absolute;
    top: 0;
    width: 25px;
    height: 59px;
    border-radius: 0 0 7px 7px;
}

.man .leg {
    background: #171819;
}

.girl .leg {
    background: #41688f;
}

.leg.left {
    left: 1px;
}

.leg.right {
    right: 1px;
}

/* =====================================
   ΛΕΥΚΑ ΠΑΠΟΥΤΣΙΑ
===================================== */

.shoe {
    position: absolute;
    top: 171px;
    width: 36px;
    height: 18px;
    background: white;
    border: 2px solid #d8d8d8;
    border-radius: 11px 16px 7px 7px;
    z-index: 10;
}

.shoe.left {
    left: 2px;
}

.shoe.right {
    right: 2px;
}

/* =====================================
   ΚΙΝΗΣΕΙΣ ΑΝΤΡΑ
===================================== */

/* βγαίνει από το αυτοκίνητο και πατάει στον δρόμο */
.man.step-out {
    left: calc(53% - 230px);
}

/* περπατάει προς την κοπέλα */
.man.go-girl {
    left: calc(20% + 145px);
}

/* πηγαίνει για το φιλί */
.man.kiss-position {
    left: calc(20% + 190px);
}

/* μπαίνει στο αμάξι */
.man.enter-car {
    left: calc(53% - 185px);
    transform: translateY(15px) scale(.8);
    opacity: 0;
}

/* =====================================
   ΚΙΝΗΣΕΙΣ ΚΟΠΕΛΑΣ
===================================== */

/* βγαίνει από την πράσινη πόρτα */
.girl.leave-door {
    left: calc(20% + 125px);
}

/* περπατάει προς τον άντρα */
.girl.go-man {
    left: calc(20% + 195px);
}

/* θέση για φιλί */
.girl.kiss-position {
    left: calc(20% + 220px);
}

/* μπαίνει στο αμάξι */
.girl.enter-car {
    left: calc(53% - 130px);
    transform: translateY(15px) scale(.8);
    opacity: 0;
}

/* =====================================
   ΗΛΙΟΤΡΟΠΙΑ
===================================== */

.flowers {
    position: absolute;
    left: calc(53% - 205px);
    bottom: 50%;
    width: 55px;
    height: 75px;
    z-index: 55;
    opacity: 0;
    transform: scale(.7);
    transition:
        left 1.5s ease,
        opacity .6s ease,
        transform .6s ease;
}

.flowers.visible {
    opacity: 1;
    transform: scale(1);
}

.flowers.to-girl {
    left: calc(20% + 185px);
}

.stem {
    position: absolute;
    bottom: 0;
    left: 25px;
    width: 5px;
    height: 52px;
    background: #4b803e;
}

.stem.two {
    left: 34px;
    transform: rotate(8deg);
}

.sunflower {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #68431f 0 25%,
            #f0bd21 27% 48%,
            #f5cb32 50% 100%
        );
}

.sunflower.one {
    left: 3px;
    top: 0;
}

.sunflower.two {
    left: 22px;
    top: 10px;
    transform: scale(.9);
}

/* =====================================
   ΚΑΡΔΙΕΣ
===================================== */

.hearts {
    position: absolute;
    left: 53%;
    bottom: 52%;
    width: 150px;
    height: 120px;
    transform: translateX(-50%);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
}

.hearts.show {
    opacity: 1;
}

.heart {
    position: absolute;
    font-size: 32px;
    animation: hearts 2.7s infinite ease-in-out;
}

.heart.one {
    left: 10px;
}

.heart.two {
    left: 60px;
    font-size: 40px;
    animation-delay: .35s;
}

.heart.three {
    left: 110px;
    font-size: 27px;
    animation-delay: .7s;
}

@keyframes hearts {
    0% {
        opacity: 0;
        transform: translateY(20px) scale(.6);
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-85px) scale(1.15);
    }
}

/* =====================================
   ΦΙΛΙ
===================================== */

.kiss {
    transform: translateX(8px);
}

.kiss::after {
    content: "❤️";
    position: absolute;
    left: 25px;
    top: -42px;
    font-size: 23px;
    animation: kissHeart 1.5s infinite;
}

@keyframes kissHeart {
    0%, 100% {
        transform: scale(.8);
    }

    50% {
        transform: scale(1.15);
    }
}

/* =====================================
   RESPONSIVE
===================================== */

@media (max-width: 700px) {

    .car {
        transform: translateX(-50%) scale(.72);
        transform-origin: bottom center;
    }

    .person {
        transform: scale(.82);
        transform-origin: bottom center;
    }

    .entrance {
        left: 8%;
        transform: scale(.85);
        transform-origin: bottom center;
    }

    .building.left {
        width: 36%;
    }

    .building.middle {
        left: 33%;
        width: 34%;
    }

    .building.right {
        width: 37%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- =================================
         ΠΟΛΥΚΑΤΟΙΚΙΑ 1
    ================================== -->

    <div class="building left">
        <div class="window lit b1w1"></div>
        <div class="window b1w2"></div>
        <div class="window lit b1w3"></div>

        <div class="window b1w4"></div>
        <div class="window lit b1w5"></div>
        <div class="window b1w6"></div>

        <div class="window lit b1w7"></div>
        <div class="window b1w8"></div>
        <div class="window lit b1w9"></div>
    </div>

    <!-- =================================
         ΠΟΛΥΚΑΤΟΙΚΙΑ 2
    ================================== -->

    <div class="building middle">
        <div class="window b2w1"></div>
        <div class="window lit b2w2"></div>
        <div class="window b2w3"></div>

        <div class="window lit b2w4"></div>
        <div class="window b2w5"></div>
        <div class="window lit b2w6"></div>

        <div class="window b2w7"></div>
        <div class="window lit b2w8"></div>
        <div class="window b2w9"></div>
    </div>

    <!-- =================================
         ΠΟΛΥΚΑΤΟΙΚΙΑ 3
    ================================== -->

    <div class="building right">
        <div class="window lit b3w1"></div>
        <div class="window b3w2"></div>
        <div class="window lit b3w3"></div>

        <div class="window b3w4"></div>
        <div class="window lit b3w5"></div>
        <div class="window b3w6"></div>

        <div class="window lit b3w7"></div>
        <div class="window b3w8"></div>
        <div class="window lit b3w9"></div>
    </div>


    <!-- =================================
         ΠΡΑΣΙΝΗ ΠΟΡΤΑ
    ================================== -->

    <div class="entrance">

        <div class="green-door" id="door">
            <div class="door-window"></div>
            <div class="door-handle"></div>
        </div>

    </div>


    <!-- =================================
         ΠΕΖΟΔΡΟΜΙΟ
    ================================== -->

    <div class="sidewalk"></div>


    <!-- =================================
         ΔΡΟΜΟΣ
    ================================== -->

    <div class="road">
        <div class="road-line"></div>
    </div>


    <!-- =================================
         ΑΝΤΡΑΣ
    ================================== -->

    <div class="person man" id="man">

        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="beard"></div>
        </div>

        <!-- ΜΑΥΡΟ ΦΟΥΤΕΡ -->
        <div class="body"></div>

        <!-- ΛΕΥΚΗ ΜΠΛΟΥΖΑ -->
        <div class="white-shirt"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <!-- ΜΑΥΡΟ ΠΑΝΤΕΛΟΝΙ -->
        <div class="pants">
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>

        <!-- ΛΕΥΚΑ ΠΑΠΟΥΤΣΙΑ -->
        <div class="shoe left"></div>
        <div class="shoe right"></div>

    </div>


    <!-- =================================
         ΚΟΠΕΛΑ
    ================================== -->

    <div class="person girl" id="girl">

        <div class="girl-hair"></div>

        <div class="head">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>

        <!-- ΓΚΡΙ ΜΠΛΟΥΖΑ -->
        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <!-- ΜΠΛΕ ΤΖΙΝ -->
        <div class="pants">
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>

        <!-- ΛΕΥΚΑ ΠΑΠΟΥΤΣΙΑ -->
        <div class="shoe left"></div>
        <div class="shoe right"></div>

    </div>


    <!-- =================================
         ΗΛΙΟΤΡΟΠΙΑ
    ================================== -->

    <div class="flowers" id="flowers">

        <div class="stem"></div>
        <div class="stem two"></div>

        <div class="sunflower one"></div>
        <div class="sunflower two"></div>

    </div>


    <!-- =================================
         MINI COOPER
    ================================== -->

    <div class="car" id="car">

        <div class="car-roof"></div>

        <div class="car-window back"></div>
        <div class="car-window front"></div>

        <div class="window-divider"></div>

        <div class="car-body"></div>

        <div class="headlight"></div>
        <div class="taillight"></div>

        <div class="wheel left"></div>
        <div class="wheel right"></div>

    </div>


    <!-- =================================
         ΚΑΡΔΙΕΣ
    ================================== -->

    <div class="hearts" id="hearts">

        <div class="heart one">❤️</div>
        <div class="heart two">❤️</div>
        <div class="heart three">💕</div>

    </div>

</div>


<script>

const door = document.getElementById("door");
const man = document.getElementById("man");
const girl = document.getElementById("girl");
const flowers = document.getElementById("flowers");
const car = document.getElementById("car");
const hearts = document.getElementById("hearts");


/*
====================================================
ΣΚΗΝΗ 1
Ο άντρας βγαίνει από το Mini.
====================================================
*/

setTimeout(() => {

    man.classList.add("step-out");

}, 800);


/*
====================================================
ΣΚΗΝΗ 2
Ανοίγει η πράσινη πόρτα.
====================================================
*/

setTimeout(() => {

    door.classList.add("open");

}, 2200);


/*
====================================================
ΣΚΗΝΗ 3
Η κοπέλα βγαίνει από την πολυκατοικία.
====================================================
*/

setTimeout(() => {

    girl.classList.add("leave-door");

}, 2700);


/*
====================================================
ΣΚΗΝΗ 4
Η κοπέλα περπατάει προς τον άντρα.
====================================================
*/

setTimeout(() => {

    girl.classList.add("go-man");

}, 4500);


/*
====================================================
ΣΚΗΝΗ 5
Ο άντρας περπατάει προς την κοπέλα.
====================================================
*/

setTimeout(() => {

    man.classList.add("go-girl");

}, 4700);


/*
====================================================
ΣΚΗΝΗ 6
Εμφανίζονται τα δύο ηλιοτρόπια.
====================================================
*/

setTimeout(() => {

    flowers.classList.add("visible");

}, 6000);


/*
====================================================
ΣΚΗΝΗ 7
Ο άντρας δίνει τα λουλούδια.
====================================================
*/
