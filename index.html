<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflowers</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #10131c;
}

.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 42%,
      #ffe9a8 0%,
      #f6cf69 18%,
      #7e6537 42%,
      #302a24 70%,
      #10131c 100%
    );
}

/* =================================
   ΛΑΜΨΗ
================================= */

.glow {
  position: absolute;
  left: 50%;
  top: 43%;
  width: 70vw;
  height: 70vw;
  max-width: 850px;
  max-height: 850px;

  transform: translate(-50%, -50%);
  border-radius: 50%;

  background: rgba(255, 220, 93, 0.14);
  filter: blur(45px);

  opacity: 0;
  transition: opacity 2s ease;
}

.scene.bloomed .glow {
  opacity: 1;
}

/* =================================
   ΦΩΤΑΚΙΑ
================================= */

.sparkles {
  position: absolute;
  inset: 0;
  opacity: .45;
}

.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;

  background: #ffe89a;
  box-shadow: 0 0 12px #ffe89a;

  animation: twinkle 2.5s infinite alternate;
}

.s1 { left: 12%; top: 20%; animation-delay: .2s; }
.s2 { left: 25%; top: 65%; animation-delay: 1s; }
.s3 { left: 78%; top: 18%; animation-delay: .6s; }
.s4 { left: 88%; top: 57%; animation-delay: 1.4s; }
.s5 { left: 18%; top: 42%; animation-delay: 1.8s; }
.s6 { left: 70%; top: 72%; animation-delay: .9s; }
.s7 { left: 45%; top: 13%; animation-delay: 1.2s; }

@keyframes twinkle {
  from {
    opacity: .2;
    transform: scale(.7);
  }

  to {
    opacity: 1;
    transform: scale(1.6);
  }
}

/* =================================
   ΠΡΩΤΟ ΗΛΙΟΤΡΟΠΙΟ
================================= */

.flower-one {
  position: absolute;

  left: 50%;
  top: 52%;

  width: 300px;
  height: 300px;

  transform:
    translate(-50%, -50%)
    scale(.06);

  opacity: 0;

  transition:
    transform 6s cubic-bezier(.18,.72,.18,1),
    opacity 2s ease;

  z-index: 10;
}

/* έρχεται από πολύ μακριά */

.scene.start .flower-one {
  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(.06);
}

/* φτάνει μπροστά */

.scene.approaching .flower-one {
  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1.15);
}

/* τελικό ακόμα μεγαλύτερο */

.scene.big .flower-one {
  transform:
    translate(-50%, -50%)
    scale(1.42);
}

/* =================================
   ΠΕΤΑΛΑ ΠΡΩΤΟΥ ΛΟΥΛΟΥΔΙΟΥ
================================= */

.petal {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 68px;
  height: 135px;

  margin-left: -34px;
  margin-top: -126px;

  border-radius: 50% 50% 45% 45%;

  background:
    linear-gradient(
      to bottom,
      #ffe95c,
      #f5c21c 65%,
      #d9950d
    );

  border: 2px solid #d99d0c;

  transform-origin: 50% 126px;

  transform:
    rotate(var(--angle))
    scaleY(.12);

  transition:
    transform 2s cubic-bezier(.2,.8,.2,1);

  box-shadow:
    inset 0 -8px 10px rgba(160,90,0,.15),
    0 0 8px rgba(255,210,40,.2);
}

.scene.open .petal {
  transform:
    rotate(var(--angle))
    scaleY(1);
}

/* θέσεις */

.p1  { --angle: 0deg; }
.p2  { --angle: 30deg; }
.p3  { --angle: 60deg; }
.p4  { --angle: 90deg; }
.p5  { --angle: 120deg; }
.p6  { --angle: 150deg; }
.p7  { --angle: 180deg; }
.p8  { --angle: 210deg; }
.p9  { --angle: 240deg; }
.p10 { --angle: 270deg; }
.p11 { --angle: 300deg; }
.p12 { --angle: 330deg; }

/* εσωτερικά πέταλα */

.petal.inner {
  width: 57px;
  height: 112px;

  margin-left: -28.5px;
  margin-top: -104px;

  transform-origin: 50% 104px;

  background:
    linear-gradient(
      to bottom,
      #fff178,
      #f7cf28 70%,
      #e6a50e
    );

  z-index: 2;
}

.scene.open .petal.inner {
  transform:
    rotate(var(--angle))
    scaleY(1);
}

/* =================================
   ΚΕΝΤΡΟ
================================= */

.flower-center {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 125px;
  height: 125px;

  transform:
    translate(-50%, -50%)
    scale(.25);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #8b5b20,
      #4d2c13 65%,
      #24170d 100%
    );

  border: 6px solid #6b4017;

  z-index: 8;

  transition:
    transform 1.5s ease .3s,
    box-shadow 1.5s ease;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.55);
}

.scene.open .flower-center {
  transform:
    translate(-50%, -50%)
    scale(1);

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.55),
    0 0 40px rgba(255,208,47,.5);
}

/* σπόροι */

.flower-center::before {
  content: "";

  position: absolute;
  inset: 19px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #2a180c 2px,
      transparent 3px
    );

  background-size: 14px 14px;

  opacity: .9;
}

/* =================================
   ΜΗΝΥΜΑ
================================= */

.message {
  position: absolute;

  left: 50%;
  top: 50%;

  width: min(570px, 72vw);

  transform:
    translate(-50%, -50%)
    scale(.96);

  z-index: 20;

  color: #fff8d2;

  text-align: center;

  font-size: clamp(16px, 2.2vw, 25px);

  line-height: 1.55;

  letter-spacing: .2px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.8),
    0 0 12px rgba(255,215,80,.3);

  opacity: 0;

  transition:
    opacity 2s ease,
    transform 2s ease;

  pointer-events: none;
}

.message.show {
  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}

/* το μήνυμα φεύγει */

.message.hide {
  opacity: 0;

  transform:
    translate(-50%, -65%)
    scale(.92);
}

/* =================================
   ΔΕΥΤΕΡΟ ΙΔΙΟ ΗΛΙΟΤΡΟΠΙΟ
================================= */

.flower-two {
  position: absolute;

  left: 50%;
  top: 52%;

  width: 300px;
  height: 300px;

  /*
    ξεκινάει δίπλα αλλά κρυφό
  */

  transform:
    translate(150px, -50%)
    scale(1.42);

  opacity: 0;

  z-index: 9;

  transition:
    transform 2.5s cubic-bezier(.2,.8,.2,1),
    opacity 1.5s ease;
}

/*
  Εμφανίζεται ΜΟΝΟ αφού φύγει
  το μήνυμα
*/

.flower-two.show {
  opacity: 1;

  transform:
    translate(190px, -50%)
    scale(1.42);
}

/* =================================
   ΠΕΤΑΛΑ ΔΕΥΤΕΡΟΥ
   ΑΚΡΙΒΩΣ ΙΔΙΑ ΜΕ ΤΟ ΠΡΩΤΟ
================================= */

.flower-two .petal {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 68px;
  height: 135px;

  margin-left: -34px;
  margin-top: -126px;

  border-radius: 50% 50% 45% 45%;

  background:
    linear-gradient(
      to bottom,
      #ffe95c,
      #f5c21c 65%,
      #d9950d
    );

  border: 2px solid #d99d0c;

  transform-origin: 50% 126px;

  transform:
    rotate(var(--angle))
    scaleY(1);

  box-shadow:
    inset 0 -8px 10px rgba(160,90,0,.15),
    0 0 8px rgba(255,210,40,.2);
}

/* εσωτερικά πέταλα δεύτερου */

.flower-two .petal.inner {
  width: 57px;
  height: 112px;

  margin-left: -28.5px;
  margin-top: -104px;

  transform-origin: 50% 104px;

  background:
    linear-gradient(
      to bottom,
      #fff178,
      #f7cf28 70%,
      #e6a50e
    );

  z-index: 2;
}

/* κέντρο δεύτερου */

.flower-two .flower-center {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 125px;
  height: 125px;

  transform:
    translate(-50%, -50%)
    scale(1);

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #8b5b20,
      #4d2c13 65%,
      #24170d 100%
    );

  border: 6px solid #6b4017;

  z-index: 8;

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.55),
    0 0 40px rgba(255,208,47,.35);
}

/* =================================
   ΤΕΛΙΚΗ ΛΑΜΨΗ
================================= */

.final-glow {
  position: absolute;

  left: 50%;
  top: 52%;

  width: 450px;
  height: 450px;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background:
    rgba(255, 220, 80, .16);

  filter: blur(55px);

  opacity: 0;

  z-index: 5;

  transition:
    opacity 2s ease;
}

.scene.final .final-glow {
  opacity: 1;
}

/* =================================
   ΚΙΝΗΤΑ
================================= */

@media (max-width: 700px) {

  .flower-one,
  .flower-two {
    width: 230px;
    height: 230px;
  }

  .petal,
  .flower-two .petal {
    width: 53px;
    height: 105px;

    margin-left: -26.5px;
    margin-top: -98px;

    transform-origin: 50% 98px;
  }

  .petal.inner,
  .flower-two .petal.inner {
    width: 45px;
    height: 88px;

    margin-left: -22.5px;
    margin-top: -82px;

    transform-origin: 50% 82px;
  }

  .flower-center,
  .flower-two .flower-center {
    width: 100px;
    height: 100px;
  }

  .message {
    width: 76vw;
    font-size: 15px;
    line-height: 1.5;
  }

  .flower-one {
    transform:
      translate(-50%, -50%)
      scale(.06);
  }

  .scene.approaching .flower-one {
    transform:
      translate(-50%, -50%)
      scale(1.05);
  }

  .scene.big .flower-one {
    transform:
      translate(-50%, -50%)
      scale(1.22);
  }

  .flower-two {
    transform:
      translate(90px, -50%)
      scale(1.22);
  }

  .flower-two.show {
    transform:
      translate(105px, -50%)
      scale(1.22);
  }
}
</style>
</head>

<body>

<div class="scene start" id="scene">

  <div class="glow"></div>
  <div class="final-glow"></div>

  <!-- ΦΩΤΑΚΙΑ -->

  <div class="sparkles">

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>
    <div class="sparkle s6"></div>
    <div class="sparkle s7"></div>

  </div>


  <!-- =================================
       ΠΡΩΤΟ ΗΛΙΟΤΡΟΠΙΟ
  ================================= -->

  <div class="flower-one">

    <!-- εξωτερικά πέταλα -->

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>
    <div class="petal p9"></div>
    <div class="petal p10"></div>
    <div class="petal p11"></div>
    <div class="petal p12"></div>

    <!-- εσωτερικά πέταλα -->

    <div class="petal inner p1"></div>
    <div class="petal inner p2"></div>
    <div class="petal inner p3"></div>
    <div class="petal inner p4"></div>
    <div class="petal inner p5"></div>
    <div class="petal inner p6"></div>
    <div class="petal inner p7"></div>
    <div class="petal inner p8"></div>
    <div class="petal inner p9"></div>
    <div class="petal inner p10"></div>
    <div class="petal inner p11"></div>
    <div class="petal inner p12"></div>

    <div class="flower-center"></div>

  </div>


  <!-- =================================
       ΜΗΝΥΜΑ
  ================================= -->

  <div class="message" id="message">

    τόσο καιρό είχα τα πέταλά μου κλειστά γιατί ούτε ο ήλιος δεν τα άνοιγε..
    ίσως χρειαζόμουν κάτι ακόμα πιο λαμπερό από εκείνον για να ανθίσω

  </div>


  <!-- =================================
       ΔΕΥΤΕΡΟ ΑΚΡΙΒΩΣ ΙΔΙΟ ΗΛΙΟΤΡΟΠΙΟ
  ================================= -->

  <div class="flower-two" id="flowerTwo">

    <!-- εξωτερικά πέταλα -->

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>
    <div class="petal p9"></div>
    <div class="petal p10"></div>
    <div class="petal p11"></div>
    <div class="petal p12"></div>

    <!-- εσωτερικά πέταλα -->

    <div class="petal inner p1"></div>
    <div class="petal inner p2"></div>
    <div class="petal inner p3"></div>
    <div class="petal inner p4"></div>
    <div class="petal inner p5"></div>
    <div class="petal inner p6"></div>
    <div class="petal inner p7"></div>
    <div class="petal inner p8"></div>
    <div class="petal inner p9"></div>
    <div class="petal inner p10"></div>
    <div class="petal inner p11"></div>
    <div class="petal inner p12"></div>

    <div class="flower-center"></div>

  </div>

</div>


<script>

const scene = document.getElementById("scene");
const message = document.getElementById("message");
const flowerTwo = document.getElementById("flowerTwo");


/*
==================================================
ΧΡΟΝΟΔΙΑΓΡΑΜΜΑ

0s      → μικρό ηλιοτρόπιο πολύ μακριά
1s      → αρχίζει να έρχεται
7.2s    → ανοίγουν τα πέταλα
9s      → εμφανίζεται το μήνυμα
12.5s   → πρώτο ηλιοτρόπιο γίνεται ακόμα μεγαλύτερο
16s     → αρχίζει να φεύγει το μήνυμα
18.5s   → το μήνυμα έχει φύγει τελείως
19s     → εμφανίζεται το δεύτερο ίδιο ηλιοτρόπιο
22s     → τελική εικόνα
==================================================
*/


/* =================================
   1. ΕΡΧΕΤΑΙ ΤΟ ΠΡΩΤΟ
================================= */

setTimeout(() => {

  scene.classList.add("approaching");

}, 1000);


/* =================================
   2. ΑΝΟΙΓΟΥΝ ΤΑ ΠΕΤΑΛΑ
================================= */

setTimeout(() => {

  scene.classList.add("open");
  scene.classList.add("bloomed");

}, 7200);


/* =================================
   3. ΕΜΦΑΝΙΖΕΤΑΙ ΤΟ ΜΗΝΥΜΑ
================================= */

setTimeout(() => {

  message.classList.add("show");

}, 9000);


/* =================================
   4. ΤΟ ΠΡΩΤΟ ΓΙΝΕΤΑΙ ΠΙΟ ΜΕΓΑΛΟ
================================= */

setTimeout(() => {

  scene.classList.add("big");

}, 12500);


/* =================================
   5. ΦΕΥΓΕΙ ΤΟ ΜΗΝΥΜΑ
================================= */

setTimeout(() => {

  message.classList.remove("show");
  message.classList.add("hide");

}, 16000);


/* =================================
   6. ΕΜΦΑΝΙΖΕΤΑΙ ΤΟ ΔΕΥΤΕΡΟ
   ΜΟΝΟ ΑΦΟΥ ΕΧΕΙ ΦΥΓΕΙ ΤΟ ΜΗΝΥΜΑ
================================= */

setTimeout(() => {

  flowerTwo.classList.add("show");

}, 19000);


/* =================================
   7. ΤΕΛΙΚΗ ΛΑΜΨΗ
================================= */

setTimeout(() => {

  scene.classList.add("final");

}, 22000);

</script>

</body>
</html>
