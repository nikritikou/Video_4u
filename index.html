===================================================== */

@keyframes manExitCar {

    0% {
        left: 52%;
        bottom: 28%;
        transform: scale(.35);
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    60% {
        left: 58%;

    }

        bottom: 28%;

    }

@keyframes girlArrives {

    0% {
        opacity: 0;

        transform:
            translateX(180px)
            scale(.85);
    }

    25% {
        opacity: 1;

        transform:
            translateX(110px)
            scale(.85);
    }

    60% {
        transform:
            translateX(45px)

    }

    100% {

@keyframes giveFlowers {

        transform: scale(.2);

    to {

    }

@keyframes flowersGive {
