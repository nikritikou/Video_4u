<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Cooper Love Story</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #d9d0c3;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            to bottom,
            #b9c8d5 0%,
            #dce1df 52%,
            #8d8b87 52%,
            #777572 100%
        );
}

/* =========================
   ΠΟΛΥΚΑΤΟΙΚΙΕΣ
========================= */

.buildings {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 55%;
}

.building {
    position: absolute;
    bottom: 0;
    background: #a99f96;
    border-left: 3px solid rgba(0,0,0,.08);
    border-right: 3px solid rgba(0,0,0,.08);
}

.building.one {
    left: 0;
    width: 27%;
    height: 88%;
    background: #b7aaa0;
}

.building.two {
    left: 23%;
    width: 30%;
    height: 72%;
    background: #9e9b99;
}

.building.three {
    left: 49%;
    width: 26%;
    height: 91%;
    background: #b2aaa4;
}

.building.four {
    right: 0;
    width: 30%;
    height: 78%;
    background: #a29b95;
}

.window {
    position: absolute;
    width: 24px;
    height: 32px;
    background: #dfe5df;
    border: 3px solid #77736e;
}

.window.lit {
    background: #f7dc87;
}

.windows {
    position: absolute;
    inset: 15px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 48px;
    gap: 16px 12px;
}

.window.small {
    width: 20px;
    height: 28px;
}

/* =========================
   ΔΡΟΜΟΣ
========================= */

.sidewalk {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 25%;
    height: 9%;
    background: #aaa69f;
    border-top: 5px solid #77746f;
    border-bottom: 4px solid #85817c;
}

.road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 25%;
    background: #4f5050;
}

.road-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 52%;
    height: 5px;
    background: repeating-linear-gradient(
        to right,
        #e8e4d8 0 70px,
        transparent 70px 130px
    );
}

/* =========================
   MINI COOPER
========================= */

.car {
    position: absolute;
    width: 330px;
    height: 145px;
    left: 50%;
    bottom: 29%;
    transform: translateX(-50%);
    z-index: 20;
    transition: left 3.5s ease-in;
}

.car.drive-away {
    left: 120%;
}

.car-body {
    position: absolute;
    left: 0;
    bottom: 15px;
    width: 330px;
    height: 90px;
    border-radius: 55px 75px 25px 25px;
    background: #cdbb9a;
    border: 4px solid #514b43;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.08);
}

.car-roof {
    position: absolute;
    left: 70px;
    top: 10px;
    width: 190px;
    height: 75px;
    background: #1f2020;
    border-radius: 85px 85px 15px 15px;
    border: 4px solid #514b43;
}

.window-front,
.window-back {
    position: absolute;
    top: 18px;
    height: 53px;
    background: #91a2aa;
    border: 3px solid #393a3a;
}

.window-front {
    left: 158px;
    width: 87px;
    border-radius: 5px 45px 5px 5px;
}

.window-back {
    left: 82px;
    width: 70px;
    border-radius: 40px 5px 5px 5px;
}

.window-divider {
    position: absolute;
    left: 154px;
    top: 15px;
    width: 5px;
    height: 63px;
    background: #272828;
}

.wheel {
    position: absolute;
    width: 58px;
    height: 58px;
    bottom: 0;
    border-radius: 50%;
    background: #202020;
    border: 5px solid #343434;
    z-index: 5;
}

.wheel::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 13px;
    top: 13px;
    border-radius: 50%;
    background: #bdbdbd;
}

.wheel.left {
    left: 47px;
}

.wheel.right {
    right: 47px;
}

.light {
    position: absolute;
    width: 25px;
    height: 20px;
    background: #fff2ae;
    border: 3px solid #625a4e;
    border-radius: 50%;
    top: 45px;
}

.light.front {
    right: 4px;
}

.light.back {
    left: 4px;
    background: #c84c43;
}

.mirror {
    position: absolute;
    width: 18px;
    height: 12px;
    background: #1d1e1e;
    border-radius: 50%;
    top: 58px;
    z-index: 8;
}

.mirror.left {
    left: 61px;
}

.mirror.right {
    right: 61px;
}

/* =========================
   ΑΝΘΡΩΠΟΙ
   ΙΔΙΟ ΥΨΟΣ
========================= */

.person {
    position: absolute;
    width: 82px;
    height: 205px;
    bottom: 34%;
    z-index: 30;
    transition:
        left 1.8s ease,
        opacity .8s ease,
        transform 1.8s ease;
}

/*
   Και οι δύο έχουν ακριβώς:
   width: 82px
   height: 205px
*/
.man {
    left: calc(50% - 155px);
}

.girl {
    left: calc(50% + 75px);
}

/* ΚΕΦΑΛΙ */

.head {
    position: absolute;
    top: 0;
    left: 20px;
    width: 44px;
    height: 48px;
    background: #e4ae83;
    border-radius: 45% 45% 48% 48%;
    z-index: 5;
}

.man .head {
    background: #dca67e;
}

.hair {
    position: absolute;
    z-index: 7;
}

.man .hair {
    display: none;
}

.beard {
    position: absolute;
    left: 8px;
    bottom: 2px;
    width: 29px;
    height: 14px;
    background: #3e3029;
    border-radius: 0 0 18px 18px;
    opacity: .8;
}

.eye {
    position: absolute;
    top: 20px;
    width: 4px;
    height: 4px;
    background: #222;
    border-radius: 50%;
}

.eye.one {
    left: 11px;
}

.eye.two {
    right: 11px;
}

.nose {
    position: absolute;
    left: 20px;
    top: 25px;
    width: 5px;
    height: 8px;
    border-right: 2px solid #a26f54;
}

.girl .hair {
    left: 13px;
    top: -5px;
    width: 58px;
    height: 63px;
    background: #e8c36d;
    border-radius: 50% 50% 45% 45%;
    z-index: 4;
}

.girl .hair::after {
    content: "";
    position: absolute;
    right: -4px;
    top: 28px;
    width: 18px;
    height: 50px;
    background: #e8c36d;
    border-radius: 0 50% 50% 0;
}

/* ΣΩΜΑ */

.body {
    position: absolute;
    top: 45px;
    left: 9px;
    width: 64px;
    height: 75px;
    border-radius: 18px 18px 8px 8px;
}

/* ΑΝΤΡΑΣ - ΜΑΥΡΟ ΦΟΥΤΕΡ */

.man .body {
    background: #181919;
}

.white-shirt {
    position: absolute;
    top: 47px;
    left: 24px;
    width: 34px;
    height: 13px;
    background: white;
    z-index: 6;
    border-radius: 0 0 5px 5px;
}

/* ΚΟΠΕΛΑ - ΓΚΡΙ ΜΠΛΟΥΖΑ */

.girl .body {
    background: #8b8d8d;
}

/* ΜΑΝΙΚΙΑ */

.arm {
    position: absolute;
    top: 53px;
    width: 18px;
    height: 68px;
    border-radius: 12px;
    z-index: 2;
}

.man .arm {
    background: #181919;
}

.girl .arm {
    background: #8b8d8d;
}

.arm.left {
    left: 0;
    transform: rotate(8deg);
}

.arm.right {
    right: 0;
    transform: rotate(-8deg);
}

/* ΠΑΝΤΕΛΟΝΙΑ */

.pants {
    position: absolute;
    top: 116px;
    left: 14px;
    width: 55px;
    height: 61px;
    z-index: 3;
}

/* ΜΑΥΡΟ ΠΑΝΤΕΛΟΝΙ */

.man .pants {
    background: #171819;
}

/* ΤΖΙΝ */

.girl .pants {
    background: #3f6690;
}

.leg {
    position: absolute;
    top: 0;
    width: 25px;
    height: 58px;
    border-radius: 0 0 7px 7px;
}

.man .leg {
    background: #171819;
}

.girl .leg {
    background: #3f6690;
}

.leg.left {
    left: 1px;
}

.leg.right {
    right: 1px;
}

/* ΠΑΠΟΥΤΣΙΑ */

.shoe {
    position: absolute;
    top: 171px;
    width: 35px;
    height: 18px;
    background: white;
    border-radius: 10px 15px 7px 7px;
    border: 2px solid #ddd;
    z-index: 5;
}

.shoe.left {
    left: 3px;
}

.shoe.right {
    right: 3px;
}

/* =========================
   ΗΛΙΟΤΡΟΠΙΑ
========================= */

.flowers {
    position: absolute;
    width: 48px;
    height: 75px;
    left: calc(50% - 87px);
    bottom: 42%;
    z-index: 40;
    opacity: 0;
    transform: scale(.7);
    transition:
        left 1.5s ease,
        bottom 1.5s ease,
        opacity .5s ease,
        transform .5s ease;
}

.flowers.show {
    opacity: 1;
    transform: scale(1);
}

.flowers.give {
    left: calc(50% + 48px);
}

.stem {
    position: absolute;
    width: 5px;
    height: 54px;
    background: #4f813f;
    bottom: 0;
    left: 22px;
    transform: rotate(-7deg);
}

.stem.two {
    left: 31px;
    transform: rotate(8deg);
}

.sunflower {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            #6b421e 0 25%,
            #f2bf24 27% 48%,
            #f4ca32 50% 100%
        );
}

.sunflower.one {
    left: 4px;
    top: 0;
}

.sunflower.two {
    left: 20px;
    top: 9px;
    transform: scale(.9);
}

/* =========================
   ΚΑΡΔΙΕΣ
========================= */

.hearts {
    position: absolute;
    left: 50%;
    bottom: 46%;
    transform: translateX(-50%);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
}

.hearts.show {
    opacity: 1;
}

.heart {
    position: absolute;
    font-size: 30px;
    animation: floatHeart 2.8s ease-in-out infinite;
}

.heart.one {
    left: -55px;
    animation-delay: 0s;
}

.heart.two {
    left: 5px;
    font-size: 38px;
    animation-delay: .4s;
}

.heart.three {
    left: 65px;
    font-size: 25px;
    animation-delay: .8s;
}

@keyframes floatHeart {
    0% {
        transform: translateY(15px) scale(.7);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        transform: translateY(-90px) scale(1.15);
        opacity: 0;
    }
}

/* =========================
   ΚΙΝΗΣΕΙΣ
========================= */

.man.exit-car {
    left: calc(50% - 155px);
}

.girl.arrive {
    left: calc(50% + 10px);
}

.man.move-kiss {
    left: calc(50% - 42px);
}

.girl.move-kiss {
    left: calc(50% + 25px);
}

.man.enter-car {
    left: calc(50% - 85px);
    transform: translateY(35px) scale(.75);
    opacity: 0;
}

.girl.enter-car {
    left: calc(50% - 35px);
    transform: translateY(35px) scale(.75);
    opacity: 0;
}

.kiss {
    transform: translateX(12px);
}

/* =========================
   ΚΑΜΕΡΑ
========================= */

.fade {
    position: absolute;
    inset: 0;
    background: black;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
}

.fade.show {
    opacity: .25;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .car {
        transform: translateX(-50%) scale(.75);
        transform-origin: bottom center;
    }

    .person {
        transform: scale(.82);
        transform-origin: bottom center;
    }

    .man {
        left: calc(50% - 125px);
    }

    .girl {
        left: calc(50% + 55px);
    }

    .building .windows {
        transform: scale(.8);
        transform-origin: top left;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- ΠΟΛΥΚΑΤΟΙΚΙΕΣ -->
    <div class="buildings">

        <div class="building one">
            <div class="windows">
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>

                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>

                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
            </div>
        </div>

        <div class="building two">
            <div class="windows">
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>

                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
            </div>
        </div>

        <div class="building three">
            <div class="windows">
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>

                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>

                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
            </div>
        </div>

        <div class="building four">
            <div class="windows">
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>

                <div class="window lit"></div>
                <div class="window"></div>
                <div class="window lit"></div>
                <div class="window"></div>
            </div>
        </div>

    </div>

    <!-- ΠΕΖΟΔΡΟΜΙΟ -->
    <div class="sidewalk"></div>

    <!-- ΔΡΟΜΟΣ -->
    <div class="road">
        <div class="road-line"></div>
    </div>

    <!-- ΑΝΤΡΑΣ -->
    <div class="person man" id="man">

        <div class="head">
            <div class="eye one"></div>
            <div class="eye two"></div>
            <div class="nose"></div>
            <div class="beard"></div>
        </div>

        <div class="body"></div>

        <!-- ΛΕΥΚΗ ΜΠΛΟΥΖΑ ΠΟΥ ΦΑΙΝΕΤΑΙ ΚΑΤΩ ΑΠΟ ΤΟ ΦΟΥΤΕΡ -->
        <div class="white-shirt"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <!-- ΜΑΥΡΟ ΠΑΝΤΕΛΟΝΙ -->
        <div class="pants">
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>

        <!-- ΛΕΥΚΑ ΠΑΠΟΥΤΣΙΑ -->
        <div class="shoe left"></div>
        <div class="shoe right"></div>

    </div>

    <!-- ΚΟΠΕΛΑ -->
    <div class="person girl" id="girl">

        <div class="hair"></div>

        <div class="head">
            <div class="eye one"></div>
            <div class="eye two"></div>
            <div class="nose"></div>
        </div>

        <!-- ΓΚΡΙ ΜΠΛΟΥΖΑ -->
        <div class="body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <!-- ΜΠΛΕ ΤΖΙΝ -->
        <div class="pants">
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>

        <!-- ΛΕΥΚΑ ΠΑΠΟΥΤΣΙΑ -->
        <div class="shoe left"></div>
        <div class="shoe right"></div>

    </div>

    <!-- ΗΛΙΟΤΡΟΠΙΑ -->
    <div class="flowers" id="flowers">

        <div class="stem"></div>
        <div class="stem two"></div>

        <div class="sunflower one"></div>
        <div class="sunflower two"></div>

    </div>

    <!-- MINI COOPER -->
    <div class="car" id="car">

        <div class="car-roof"></div>

        <div class="window-back"></div>
        <div class="window-front"></div>
        <div class="window-divider"></div>

        <div class="car-body"></div>

        <div class="light front"></div>
        <div class="light back"></div>

        <div class="mirror left"></div>
        <div class="mirror right"></div>

        <div class="wheel left"></div>
        <div class="wheel right"></div>

    </div>

    <!-- ΚΑΡΔΙΕΣ -->
    <div class="hearts" id="hearts">
        <div class="heart one">❤️</div>
        <div class="heart two">❤️</div>
        <div class="heart three">💕</div>
    </div>

    <div class="fade" id="fade"></div>

</div>

<script>

const man = document.getElementById("man");
const girl = document.getElementById("girl");
const flowers = document.getElementById("flowers");
const hearts = document.getElementById("hearts");
const car = document.getElementById("car");
const fade = document.getElementById("fade");

/*
==================================================
ΣΚΗΝΗ 1
Ο άντρας βγαίνει από το Mini
==================================================
*/

setTimeout(() => {
    man.classList.add("exit-car");
}, 500);


/*
==================================================
ΣΚΗΝΗ 2
Η κοπέλα πλησιάζει
==================================================
*/

setTimeout(() => {
    girl.classList.add("arrive");
}, 2200);


/*
==================================================
ΣΚΗΝΗ 3
Εμφανίζονται τα ηλιοτρόπια
==================================================
*/

setTimeout(() => {
    flowers.classList.add("show");
}, 4000);


/*
==================================================
ΣΚΗΝΗ 4
Ο άντρας δίνει τα λουλούδια στην κοπέλα
==================================================
*/

setTimeout(() => {
    flowers.classList.add("give");
}, 5000);


/*
==================================================
ΣΚΗΝΗ 5
Πλησιάζουν για φιλί
==================================================
*/

setTimeout(() => {

    man.classList.add("move-kiss");
    girl.classList.add("move-kiss");

}, 6500);


/*
==================================================
ΣΚΗΝΗ 6
Φιλί
==================================================
*/

setTimeout(() => {

    man.classList.add("kiss");
    girl.classList.add("kiss");

}, 8000);


/*
==================================================
ΣΚΗΝΗ 7
Καρδιές εμφανίζονται
==================================================
*/

setTimeout(() => {

    hearts.classList.add("show");

}, 8500);


/*
==================================================
ΣΚΗΝΗ 8
Μπαίνουν στο αυτοκίνητο
==================================================
*/

setTimeout(() => {

    man.classList.add("enter-car");
    girl.classList.add("enter-car");

    flowers.style.opacity = "0";

}, 10000);


/*
==================================================
ΣΚΗΝΗ 9
Το Mini φεύγει
==================================================
*/

setTimeout(() => {

    car.classList.add("drive-away");

}, 12000);


/*
==================================================
ΣΚΗΝΗ 10
Μικρό fade στο τέλος
==================================================
*/

setTimeout(() => {

    fade.classList.add("show");

}, 14500);

</script>

</body>
</html>
