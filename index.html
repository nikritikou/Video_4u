<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflowers</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #10131c;
}

.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 42%,
      #ffe9a8 0%,
      #f6cf69 18%,
      #7e6537 42%,
      #302a24 70%,
      #10131c 100%);
}

/* απαλή λάμψη */
.glow {
  position: absolute;
  left: 50%;
  top: 43%;
  width: 55vw;
  height: 55vw;
  max-width: 650px;
  max-height: 650px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(255, 220, 93, 0.12);
  filter: blur(35px);
  opacity: 0;
  transition: opacity 2s ease;
}

.scene.bloomed .glow {
  opacity: 1;
}

/* μικρά φωτάκια στο βάθος */
.sparkles {
  position: absolute;
  inset: 0;
  opacity: .45;
}

.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffe89a;
  box-shadow: 0 0 12px #ffe89a;
  animation: twinkle 2.5s infinite alternate;
}

.s1 { left: 12%; top: 20%; animation-delay: .2s; }
.s2 { left: 25%; top: 65%; animation-delay: 1s; }
.s3 { left: 78%; top: 18%; animation-delay: .6s; }
.s4 { left: 88%; top: 57%; animation-delay: 1.4s; }
.s5 { left: 18%; top: 42%; animation-delay: 1.8s; }
.s6 { left: 70%; top: 72%; animation-delay: .9s; }
.s7 { left: 45%; top: 13%; animation-delay: 1.2s; }

@keyframes twinkle {
  from {
    opacity: .2;
    transform: scale(.7);
  }
  to {
    opacity: 1;
    transform: scale(1.6);
  }
}

/* =========================
   ΠΡΩΤΟ ΗΛΙΟΤΡΟΠΙΟ
========================= */

.flower-one {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 250px;
  height: 250px;
  transform: translate(-50%, -50%) scale(.08);
  opacity: 0;
  transition:
    transform 6s cubic-bezier(.18,.72,.18,1),
    opacity 2s ease;
  z-index: 10;
}

/* έρχεται από μακριά */
.scene.start .flower-one {
  opacity: 1;
  transform: translate(-50%, -50%) scale(.08);
}

.scene.approaching .flower-one {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* πέταλα */
.petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 58px;
  height: 115px;
  margin-left: -29px;
  margin-top: -108px;
  border-radius: 50% 50% 45% 45%;
  background:
    linear-gradient(
      to bottom,
      #ffe95c,
      #f5c21c 65%,
      #d9950d
    );
  border: 2px solid #d99d0c;
  transform-origin: 50% 108px;
  transform: rotate(var(--angle)) scaleY(.16);
  transition:
    transform 2s cubic-bezier(.2,.8,.2,1);
  box-shadow:
    inset 0 -8px 10px rgba(160,90,0,.15),
    0 0 8px rgba(255,210,40,.2);
}

.scene.open .petal {
  transform: rotate(var(--angle)) scaleY(1);
}

/* οι 12 θέσεις των πετάλων */
.p1  { --angle: 0deg; }
.p2  { --angle: 30deg; }
.p3  { --angle: 60deg; }
.p4  { --angle: 90deg; }
.p5  { --angle: 120deg; }
.p6  { --angle: 150deg; }
.p7  { --angle: 180deg; }
.p8  { --angle: 210deg; }
.p9  { --angle: 240deg; }
.p10 { --angle: 270deg; }
.p11 { --angle: 300deg; }
.p12 { --angle: 330deg; }

/* δεύτερη σειρά πετάλων */
.petal.inner {
  width: 48px;
  height: 96px;
  margin-left: -24px;
  margin-top: -89px;
  transform-origin: 50% 89px;
  background:
    linear-gradient(
      to bottom,
      #fff178,
      #f7cf28 70%,
      #e6a50e
    );
  z-index: 2;
}

.scene.open .petal.inner {
  transform: rotate(var(--angle)) scaleY(1);
}

/* κέντρο */
.flower-center {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 108px;
  height: 108px;
  transform: translate(-50%, -50%) scale(.25);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%,
      #8b5b20,
      #4d2c13 65%,
      #24170d 100%);
  border: 5px solid #6b4017;
  z-index: 8;
  transition:
    transform 1.5s ease .3s,
    box-shadow 1.5s ease;
  box-shadow:
    inset 0 0 18px rgba(0,0,0,.55);
}

.scene.open .flower-center {
  transform: translate(-50%, -50%) scale(1);
  box-shadow:
    inset 0 0 18px rgba(0,0,0,.55),
    0 0 35px rgba(255,208,47,.5);
}

/* σπόροι */
.flower-center::before {
  content: "";
  position: absolute;
  inset: 17px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #2a180c 2px, transparent 3px);
  background-size: 13px 13px;
  opacity: .9;
}

/* =========================
   ΜΗΝΥΜΑ
========================= */

.message {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(520px, 72vw);
  transform: translate(-50%, -50%);
  z-index: 20;
  color: #fff8d2;
  text-align: center;
  font-size: clamp(16px, 2.2vw, 25px);
  line-height: 1.55;
  letter-spacing: .2px;
  text-shadow:
    0 2px 4px rgba(0,0,0,.8),
    0 0 12px rgba(255,215,80,.3);
  opacity: 0;
  transition:
    opacity 2s ease,
    transform 2s ease;
  pointer-events: none;
}

.message.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* =========================
   ΔΕΥΤΕΡΟ ΗΛΙΟΤΡΟΠΙΟ
========================= */

.flower-two {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 185px;
  height: 185px;
  transform: translate(135px, -50%) scale(.1);
  opacity: 0;
  z-index: 30;
  transition:
    transform 2.8s cubic-bezier(.2,.8,.2,1),
    opacity 1.5s ease;
}

.flower-two.show {
  opacity: 1;
  transform: translate(150px, -50%) scale(1);
}

/* πέταλα δεύτερου λουλουδιού */
.small-petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 43px;
  height: 84px;
  margin-left: -21.5px;
  margin-top: -78px;
  border-radius: 50%;
  background:
    linear-gradient(
      to bottom,
      #ffe75a,
      #f1bd17 70%,
      #d7900c
    );
  border: 2px solid #d39a0d;
  transform-origin: 50% 78px;
  transform: rotate(var(--angle)) scaleY(.15);
  transition: transform 1.8s ease;
}

.flower-two.show .small-petal {
  transform: rotate(var(--angle)) scaleY(1);
}

.small-center {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 76px;
  height: 76px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%,
      #80511c,
      #3e2410 70%);
  border: 4px solid #5d3512;
  z-index: 5;
}

/* =========================
   ΤΕΛΙΚΗ ΛΑΜΨΗ
========================= */

.final-glow {
  position: absolute;
  left: 50%;
  top: 52%;
  width: 300px;
  height: 300px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: rgba(255, 220, 80, .15);
  filter: blur(45px);
  opacity: 0;
  z-index: 5;
  transition: opacity 2s ease;
}

.scene.final .final-glow {
  opacity: 1;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  .flower-one {
    width: 205px;
    height: 205px;
  }

  .petal {
    width: 48px;
    height: 94px;
    margin-left: -24px;
    margin-top: -88px;
    transform-origin: 50% 88px;
  }

  .petal.inner {
    width: 40px;
    height: 78px;
    margin-left: -20px;
    margin-top: -73px;
    transform-origin: 50% 73px;
  }

  .flower-center {
    width: 88px;
    height: 88px;
  }

  .flower-two {
    width: 145px;
    height: 145px;
  }

  .small-petal {
    width: 34px;
    height: 67px;
    margin-left: -17px;
    margin-top: -62px;
    transform-origin: 50% 62px;
  }

  .small-center {
    width: 60px;
    height: 60px;
  }

  .message {
    width: 70vw;
    font-size: 15px;
    line-height: 1.5;
  }

  .flower-two.show {
    transform: translate(105px, -50%) scale(.9);
  }
}
</style>
</head>

<body>

<div class="scene start" id="scene">

  <div class="glow"></div>
  <div class="final-glow"></div>

  <div class="sparkles">
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>
    <div class="sparkle s6"></div>
    <div class="sparkle s7"></div>
  </div>

  <!-- ΠΡΩΤΟ ΗΛΙΟΤΡΟΠΙΟ -->

  <div class="flower-one">

    <!-- εξωτερικά πέταλα -->
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>
    <div class="petal p9"></div>
    <div class="petal p10"></div>
    <div class="petal p11"></div>
    <div class="petal p12"></div>

    <!-- εσωτερικά πέταλα -->
    <div class="petal inner p1"></div>
    <div class="petal inner p2"></div>
    <div class="petal inner p3"></div>
    <div class="petal inner p4"></div>
    <div class="petal inner p5"></div>
    <div class="petal inner p6"></div>
    <div class="petal inner p7"></div>
    <div class="petal inner p8"></div>
    <div class="petal inner p9"></div>
    <div class="petal inner p10"></div>
    <div class="petal inner p11"></div>
    <div class="petal inner p12"></div>

    <div class="flower-center"></div>

  </div>

  <!-- ΜΗΝΥΜΑ -->

  <div class="message" id="message">
    τόσο καιρό είχα τα πέταλά μου κλειστά γιατί ούτε ο ήλιος δεν τα άνοιγε..
    ίσως χρειαζόμουν κάτι ακόμα πιο λαμπερό από εκείνον για να ανθίσω
  </div>

  <!-- ΔΕΥΤΕΡΟ ΗΛΙΟΤΡΟΠΙΟ -->

  <div class="flower-two" id="flowerTwo">

    <div class="small-petal p1"></div>
    <div class="small-petal p2"></div>
    <div class="small-petal p3"></div>
    <div class="small-petal p4"></div>
    <div class="small-petal p5"></div>
    <div class="small-petal p6"></div>
    <div class="small-petal p7"></div>
    <div class="small-petal p8"></div>
    <div class="small-petal p9"></div>
    <div class="small-petal p10"></div>
    <div class="small-petal p11"></div>
    <div class="small-petal p12"></div>

    <div class="small-center"></div>

  </div>

</div>

<script>

const scene = document.getElementById("scene");
const message = document.getElementById("message");
const flowerTwo = document.getElementById("flowerTwo");

/*
  ΣΚΗΝΗ

  0s     : το πρώτο ηλιοτρόπιο είναι πολύ μακριά
  1s     : αρχίζει να έρχεται προς την οθόνη
  7s     : έχει φτάσει μπροστά
  8s     : ανοίγουν τα πέταλα
  10s    : εμφανίζεται το μήνυμα
  15s    : έρχεται το δεύτερο ηλιοτρόπιο
  18s    : τελική εικόνα
*/

// αρχή
setTimeout(() => {
  scene.classList.add("approaching");
}, 1000);

// ανοίγει τα πέταλα
setTimeout(() => {
  scene.classList.add("open");
  scene.classList.add("bloomed");
}, 7200);

// εμφανίζεται το μήνυμα
setTimeout(() => {
  message.classList.add("show");
}, 9000);

// έρχεται το δεύτερο ηλιοτρόπιο
setTimeout(() => {
  flowerTwo.classList.add("show");
}, 15000);

// τελική λάμψη
setTimeout(() => {
  scene.classList.add("final");
}, 17500);

</script>

</body>
</html>
